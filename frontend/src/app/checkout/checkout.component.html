<div class="checkout-page section-padding">
    <div class="container">
        <div class="section-header" style="text-align: left;">
            <h2>Checkout</h2>
            <p>Complete your order details below</p>
        </div>

        <div class="checkout-grid">
            <!-- Order Summary -->
            <div class="order-summary">
                <div class="summary-card">
                    <h4><i class="fas fa-shopping-cart"></i> Order Summary</h4>
                    <div class="summary-item" *ngIf="detail && detail.title">
                        <div>
                            <h5>{{detail.title}}</h5>
                            <p>{{detail.description}}</p>
                        </div>
                    </div>
                    <div class="summary-total" *ngIf="detail && detail.price">
                        <span>Total (INR)</span>
                        <strong class="badge-price">₹ {{detail.price}}</strong>
                    </div>
                </div>
            </div>

            <!-- Billing Form -->
            <div class="billing-form">
                <div class="billing-card">
                    <h4>Billing Address</h4>
                    <form class="form-modern">
                        <div class="form-row-grid">
                            <div class="form-group">
                                <label>First Name</label>
                                <input type="text" placeholder="John" required>
                            </div>
                            <div class="form-group">
                                <label>Last Name</label>
                                <input type="text" placeholder="Doe" required>
                            </div>
                        </div>

                        <div class="form-row-grid">
                            <div class="form-group">
                                <label>Email</label>
                                <input type="email" placeholder="you@example.com">
                            </div>
                            <div class="form-group">
                                <label>Phone</label>
                                <input type="tel" placeholder="+91 XXXXX XXXXX">
                            </div>
                        </div>

                        <div class="form-group">
                            <label>Address</label>
                            <input type="text" placeholder="1234 Main St" required>
                        </div>

                        <div class="form-row-grid-3">
                            <div class="form-group">
                                <label>Country</label>
                                <select>
                                    <option value="">Choose...</option>
                                    <option>India</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label>State</label>
                                <select>
                                    <option value="">Choose...</option>
                                    <option>Maharashtra</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label>Zip Code</label>
                                <input type="text" placeholder="440001" required>
                            </div>
                        </div>

                        <hr style="margin: 24px 0; border-color: var(--gray-200);">

                        <h4>Payment Method</h4>
                        <div class="payment-options">
                            <label class="payment-option">
                                <input type="radio" name="paymentMethod" checked> Credit Card
                            </label>
                            <label class="payment-option">
                                <input type="radio" name="paymentMethod"> Debit Card
                            </label>
                            <label class="payment-option">
                                <input type="radio" name="paymentMethod"> UPI / PayPal
                            </label>
                        </div>

                        <div class="form-row-grid" style="margin-top: 20px;">
                            <div class="form-group">
                                <label>Name on Card</label>
                                <input type="text" placeholder="Full name" required>
                            </div>
                            <div class="form-group">
                                <label>Card Number</label>
                                <input type="text" placeholder="XXXX XXXX XXXX XXXX" required>
                            </div>
                        </div>
                        <div class="form-row-grid">
                            <div class="form-group">
                                <label>Expiration</label>
                                <input type="text" placeholder="MM/YY" required>
                            </div>
                            <div class="form-group">
                                <label>CVV</label>
                                <input type="text" placeholder="XXX" required>
                            </div>
                        </div>

                        <button type="submit" class="btn-primary-custom checkout-btn">
                            <i class="fas fa-lock"></i> Place Order
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
