<div class="login-page">
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <div class="login-icon">
                    <i class="fas fa-user-circle"></i>
                </div>
                <h2>Welcome Back</h2>
                <p>Sign in to access your account</p>
            </div>

            <form class="form-modern" [formGroup]="loginForm" (ngSubmit)="login(loginForm.value)">
                <div class="form-group">
                    <label for="email"><i class="fas fa-envelope"></i> Email Address</label>
                    <input type="email" id="email" placeholder="Enter your email" formControlName="email">
                    <p class="error-text" *ngIf="loginForm.get('email')!.invalid && loginForm.get('email')!.touched">
                        Please enter a valid email address
                    </p>
                </div>

                <div class="form-group">
                    <label for="password"><i class="fas fa-lock"></i> Password</label>
                    <input type="password" id="password" placeholder="Enter your password" formControlName="password">
                    <p class="error-text"
                        *ngIf="loginForm.get('password')!.invalid && loginForm.get('password')!.touched">
                        Password is required
                    </p>
                </div>

                <button type="submit" class="btn-primary-custom login-submit" [disabled]="loginForm.invalid">
                    Sign In <i class="fas fa-arrow-right"></i>
                </button>
            </form>

            <div class="login-footer">
                <p>Don't have an account? <a routerLink="/signup">Create Account</a></p>
            </div>
        </div>
    </div>
</div>
