<!-- ========== PAINTER PAGE ========== -->
<section class="product-page-header">
    <div class="container">
        <span class="page-badge"><i class="fas fa-paint-roller"></i> Painting Materials</span>
        <h1>Our Paint Collection</h1>
        <p>Premium paints and coatings from top brands for every surface</p>
    </div>
</section>

<section class="product-listing section-padding">
    <div class="container">
        <div class="product-grid" *ngIf="paintlist.length > 0">
            <div class="product-card" *ngFor="let paint of paintlist">
                <div class="product-img">
                    <img [src]="paint.image" [alt]="paint.title">
                </div>
                <div class="product-body">
                    <h3>{{paint.title}}</h3>
                    <p class="product-desc">{{paint.description}}</p>
                    <div class="product-footer">
                        <span class="badge-price">₹ {{paint.price}}</span>
                        <a *ngIf="userloggedin" routerLink="/checkout/{{paint._id}}" class="btn-primary-custom btn-sm">
                            Buy Now <i class="fas fa-shopping-cart"></i>
                        </a>
                        <a *ngIf="!userloggedin" routerLink="/login" class="btn-outline-custom btn-sm">
                            Login to Buy
                        </a>
                    </div>
                </div>
            </div>
        </div>

        <div class="empty-state" *ngIf="paintlist.length === 0">
            <i class="fas fa-box-open"></i>
            <h3>No products available</h3>
            <p>Products will appear here once they are added to the catalog.</p>
        </div>
    </div>
</section>
