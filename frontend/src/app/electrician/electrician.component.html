<section class="product-page-header">
    <div class="container">
        <span class="page-badge"><i class="fas fa-bolt"></i> Electrical Materials</span>
        <h1>Electrical Products</h1>
        <p>Quality electrical supplies — switches, wires, cables & more</p>
    </div>
</section>

<section class="product-listing section-padding">
    <div class="container">
        <div class="product-grid" *ngIf="data.length > 0">
            <div class="product-card" *ngFor="let item of data">
                <div class="product-img">
                    <img [src]="item.image" [alt]="item.title">
                </div>
                <div class="product-body">
                    <h3>{{item.title}}</h3>
                    <p class="product-desc">{{item.description}}</p>
                    <div class="product-footer">
                        <span class="badge-price">₹ {{item.price}}</span>
                        <a *ngIf="userloggedin" routerLink="/checkout/{{item._id}}" class="btn-primary-custom btn-sm">
                            Buy Now <i class="fas fa-shopping-cart"></i>
                        </a>
                        <a *ngIf="!userloggedin" routerLink="/login" class="btn-outline-custom btn-sm">
                            Login to Buy
                        </a>
                    </div>
                </div>
            </div>
        </div>

        <div class="empty-state" *ngIf="data.length === 0">
            <i class="fas fa-box-open"></i>
            <h3>No products available</h3>
            <p>Products will appear here once they are added to the catalog.</p>
        </div>
    </div>
</section>
